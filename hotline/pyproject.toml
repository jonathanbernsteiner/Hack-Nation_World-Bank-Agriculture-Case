[project]
name = "hotline"
version = "0.1.0"
description = "Kiswahili coffee price and problem hotline (Uganda): FastAPI app on Vercel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotline"]

[tool.vercel]
entrypoint = "hotline.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "supabase: needs the real Supabase database (set RUN_SUPABASE=1)",
    "live: calls live Anthropic or ElevenLabs APIs (set RUN_LIVE=1)",
]
