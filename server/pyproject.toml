[project]
name = "farm-ledger"
version = "0.1.0"
description = "Local SQLite farm ledger (farmers, calls, entries)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
