[project]
name = "farm-ledger"
version = "0.1.0"
description = "Local SQLite farm ledger (farmers, calls, entries)"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # faster-whisper 1.2.1 breaks on av 19 (metadata_errors kwarg)
    "faster-whisper>=1.2.1",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm_ledger", "pipeline", "synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs a real model (Whisper or NLLB; set RUN_SLOW=1)"]

# CPU-only torch on Linux: the default PyPI wheel drags in several GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
