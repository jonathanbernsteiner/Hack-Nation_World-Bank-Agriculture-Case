[project]
name = "farm-ledger"
version = "0.1.0"
description = "Local SQLite farm ledger (farmers, calls, entries)"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # faster-whisper 1.2.1 breaks on av 19 (metadata_errors kwarg)
    "faster-whisper>=1.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["farm_ledger", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real Whisper model (set RUN_SLOW=1)"]
